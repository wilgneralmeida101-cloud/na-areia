<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1351b4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Na Areia Vendedor">
  <title>Na Areia — Vendedor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../icone-vendedor.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icone-vendedor-192.png">
  <link rel="stylesheet" href="../comum/base.css">
  <link rel="stylesheet" href="vender.css">
</head>
<body>
  <header class="topo">
    <img class="logo" src="../icone-vendedor.svg" alt="">
    <div><div class="nome">Na Areia</div><div class="sub">Área do vendedor</div></div>
  </header>
  <main id="conteudo" aria-live="polite"><p class="suave">Carregando…</p></main>
  <nav class="abas" id="abas" hidden aria-label="Menu">
    <button type="button" data-tela="inicio"><span class="emoji">🏠</span>Início</button>
    <button type="button" data-tela="produtos"><span class="emoji">🛍️</span>Produtos</button>
    <button type="button" data-tela="perfil"><span class="emoji">🏖️</span>Minha banca</button>
  </nav>
  <input id="arquivo-foto" type="file" accept="image/*" hidden>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../comum/config.js"></script>
  <script src="../comum/util.js"></script>
  <script src="vender.js"></script>
</body>
</html>
